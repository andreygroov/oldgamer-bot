spring:
  application:
    name: oldgamer-bot

# Database Configuration
db:
  url: jdbc:postgresql://localhost:5432/oldgamer_bot
  user: postgres
  password: postgres
  driver: org.postgresql.Driver

# Telegram Bot Configuration
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:YOUR_TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME:oldgamer_shop_bot}
  channel:
    id: ${TELEGRAM_CHANNEL_ID:-1001234567890}

# Claude API Configuration
claude:
  api:
    key: ${CLAUDE_API_KEY:YOUR_CLAUDE_API_KEY}
  model: claude-3-5-sonnet-20241022

# RAWG.io API Configuration (free, no auth needed for basic tier)
rawg:
  api:
    key: ${RAWG_API_KEY:YOUR_RAWG_API_KEY}

# Giant Bomb API Configuration (free, no 2FA)
giantbomb:
  api:
    key: ${GIANTBOMB_API_KEY:YOUR_GIANTBOMB_API_KEY}

# Logging
logging:
  level:
    root: INFO
    com.oldgamer.bot: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
