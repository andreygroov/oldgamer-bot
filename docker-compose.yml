services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: oldgamer-postgres
    environment:
      POSTGRES_DB: oldgamer_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    restart: on-failure

  # Old Gamer Bot
  bot:
    image: oldgamer-bot:latest
    container_name: oldgamer-bot
    depends_on:
      - postgres
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/oldgamer_bot
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DRIVER: org.postgresql.Driver

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}

      # Claude API
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}

      # RAWG API
      RAWG_API_KEY: ${RAWG_API_KEY}

      # Giant Bomb API
      GIANTBOMB_API_KEY: ${GIANTBOMB_API_KEY}

      # Spring
      SPRING_APPLICATION_NAME: oldgamer-bot
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_OLDGAMER_BOT: DEBUG

    ports:
      - "8080:8080"
    restart: on-failure
    env_file: .env
